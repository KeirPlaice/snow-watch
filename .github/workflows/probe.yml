name: probe
on:
  push:
    branches: [probe2]
jobs:
  probe:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.49.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.49.1 && node scripts/live_check.js
        env:
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: live_*.png
