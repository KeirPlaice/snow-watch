name: Daily refresh and deploy

on:
  schedule:
    - cron: '31 5 * * *'   # 06:31 in Girona in winter (05:31 UTC), every day
  workflow_dispatch:         # "Run workflow" button for a refresh on demand
  push:
    branches: [main]

permissions:
  contents: write   # pushes the day's data files to the data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: pip install shapely

      - id: pages
        uses: actions/configure-pages@v6

      # yesterday's records (danger history, station days, last good bulletins) carry over from the live site
      - name: Get yesterday's records
        run: |
          mkdir -p prev
          for f in danger_history stations_daily bulletins; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f.json" -o "prev/$f.json" || rm -f "prev/$f.json"
          done
          ls -l prev

      - name: Fetch today's data
        env:
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}   # MET Norway observations for the Norway tabs
        run: |
          args=""
          [ -f prev/danger_history.json ] && args="$args --prev-danger prev/danger_history.json"
          [ -f prev/stations_daily.json ] && args="$args --prev-stations prev/stations_daily.json"
          [ -f prev/bulletins.json ] && args="$args --prev-bulletins prev/bulletins.json"
          mkdir -p daily
          python3 scripts/snow_fetch.py daily $args || { echo "retrying in a minute"; sleep 60; python3 scripts/snow_fetch.py daily $args; }

      # the same files on the data branch, for the Claude dashboard's daily refresh to copy
      - name: Save today's data to the data branch
        run: |
          mkdir -p /tmp/data && cp daily/*.json /tmp/data/ && cd /tmp/data
          date -u +%Y-%m-%dT%H:%MZ > fetched_utc.txt
          git init -q -b data
          git add -A
          git -c user.name="snow-watch" -c user.email="KeirPlaice@users.noreply.github.com" commit -q -m "Data $(cat fetched_utc.txt)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Build the site
        run: python3 scripts/build_site.py --daily daily --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
