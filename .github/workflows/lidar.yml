name: Fetch lidar terrain (one-off)

# Run by hand. Downloads a terrain model whose server the map builder can't reach directly,
# resamples it onto a slope map's 5 m grid and pushes the result to the lidar-data branch
# (fetched from there to build the map; the site never serves this branch).
on:
  workflow_dispatch:
    inputs:
      area:
        description: "Which map"
        required: true
        default: innsbruck

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install packages
        run: pip install rasterio numpy
      - name: Find, fetch and resample
        run: python3 scripts/fetch_lidar.py ${{ github.event.inputs.area }} out
      - name: Push to the lidar-data branch
        run: |
          cd out/grid
          git init -q -b lidar-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Lidar grid for ${{ github.event.inputs.area }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lidar-data
